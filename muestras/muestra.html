<!DOCTYPE html>
<!-- Comentario: gris cálido en cursiva -->
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <!-- Etiquetas (meta, title, link): CEREZA · atributos (charset, href): MOSTAZA · valores: MENTA -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muestra del tema Vainilla</title>
    <link rel="stylesheet" href="muestra.css">
  </head>
  <body>
    <header class="cabecera" id="inicio">
      <h1>Hola, soy Yenai</h1>
      <nav>
        <ul>
          <li><a href="#proyectos">Proyectos</a></li>
          <li><a href="mailto:ejemplo@correo.cat">Contacto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <!-- Entidades (&amp; &lt; &copy;): MELOCOTÓN -->
      <p>Estudio <strong>ASIX</strong> &amp; me gustan los &lt;servidores&gt;.</p>
      <p style="color: red">Estilo en línea: el CSS de dentro también se colorea.</p>
      <img src="logo.png" alt="Logo" width="120">
    </main>

    <footer>&copy; 2026 Yenai</footer>

    <script>
      // JavaScript dentro de HTML: palabras clave LAVANDA, funciones CELESTE
      const saludo = "Hola";
      function saludar(nombre) {
        return `${saludo}, ${nombre}!`;
      }
      console.log(saludar("mundo"), 42, true);
    </script>
  </body>
</html>
